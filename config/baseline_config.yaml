# RiskNICLP-5G Baseline Configuration
# This configuration implements the "能跑、能评、能扩展" baseline model
# Phase 2: Enhanced with Risk-Bias attention, negative sampling, and temporal prediction

# Model Architecture
model:
  # 节点类型特征维度配置 (方案B)
  node_feature_dims:
    Alert: 9        # Alert节点固定9维 (修复后)
    Flow: 17        # Flow节点17维 (原始维度)
    UE: 16          # UE节点16维 (原始维度)
  
  # 模型架构参数  
  input_dim: 112               # Original feature dimension
  feature_dim: 45              # Selected feature dimension
  hidden_dim: 64               # Hidden layer dimension
  risk_embed_dim: 16           # Risk embedding dimension
  num_risk_bins: 8             # Risk discretization bins
  num_heads: 4                 # GAT attention heads
  num_layers: 2                # Number of GNN layers
  dropout: 0.1                 # Dropout rate
  temperature: 0.1             # Attention temperature
  gravity_epsilon: 1e-3        # RiskGravity decoder epsilon

# Phase 2 Configuration
phase2:
  # Risk-Bias Attention
  risk_bias_attention:
    enabled: true              # Enable risk-bias attention
    method: 'simplified'       # 'simplified' | 'full'
    beta_1: 0.5                # Source node risk weight
    beta_2: 0.5                # Destination node risk weight
    temperature: 0.1           # Risk bias temperature
    
  # Negative Sampling
  negative_sampling:
    enabled: true              # Enable negative sampling
    type: 'risk_aware'         # 'baseline' | 'risk_aware'
    strategy: 'semantic'       # 'uniform' | 'stratified' | 'hard' | 'semantic'
    neg_ratio: 3               # Negative to positive sample ratio
    risk_thresholds: [0.8, 0.5, 0.2]  # Risk stratification thresholds
    hard_ratio: 0.3            # Hard negative sample ratio
    seed: 42                   # Random seed for sampling
    
    # Attack semantic mapping for risk-aware sampling
    attack_type_mapping:
      'Benign': 0.0
      'ICMPFlood': 0.3
      'UDPFlood': 0.4
      'SYNFlood': 0.6
      'HTTPFlood': 0.7
      'SlowrateDoS': 0.8
      'TCPConnectScan': 0.7
      'SYNScan': 0.6
      'UDPScan': 0.5
      
    # Sampling quality control
    max_attempts_multiplier: 10  # Maximum attempts multiplier
    quality_threshold: 0.9       # Sampling quality threshold
    
    # Cross-type sampling ratios for semantic strategy
    semantic_ratios:
      ue_flow_ratio: 0.4         # UE->Flow false initiation ratio
      flow_alert_ratio: 0.3      # Flow->Alert false trigger ratio
      high_risk_ratio: 0.3       # High-risk internal connections ratio
    
  # Temporal Prediction - 优化架构策略
  temporal_prediction:
    enabled: true              # Enable temporal prediction
    method: 'hetero_lstm'      # 'hetero_lstm' (P0推荐) | 'tgat_risk' (P1目标) | 'graph_rnn' (P2对比) | 'lstm_baseline'
    window_size: 5             # Historical window size
    stride: 1                  # Sliding window stride
    future_steps: 3            # Number of future steps to predict
    lead_time_targets: [5, 10, 15]  # Target lead-time thresholds (seconds)
    
    # P0 HeteroLSTM配置 - 快速实施版本
    hetero_lstm:
      spatial_encoder_reuse: true      # 复用SharedEncoder进行空间编码
      graph_aggregation: 'mean_pool'   # 'mean_pool' | 'max_pool' | 'attention'
      lstm_layers: 1                   # LSTM层数 (保持简单)
      bidirectional: false             # 单向LSTM (减少复杂度)
      
    # P1 TGAT+Risk配置 - 性能目标版本  
    tgat_risk:
      edge_level_modeling: true        # 边级事件流建模
      risk_bias_temperature: 0.1       # 风险偏置温度参数
      num_heads: 4                     # 注意力头数
      time_encoding_dim: 16            # 时间编码维度
      
    # P2 Graph-RNN配置 - 消融实验版本
    graph_rnn:
      node_level_generation: true      # 节点级生成模式
      rnn_type: 'GRU'                  # 'GRU' | 'LSTM'
      message_passing_steps: 3         # 消息传递步数
    
  # Cross-Scale Context
  cross_scale_context:
    enabled: true              # Enable cross-scale context
    fusion_method: 'gate'      # 'gate' | 'attention'
    
  # Training Enhancements
  training_enhancements:
    progressive: true          # Enable progressive training
    base_epochs: 20            # Base training epochs
    risk_epochs: 30            # Risk-aware training epochs
    scheduler: 'cosine'        # 'cosine' | 'step' | 'reduce_on_plateau'
    early_stopping:
      enabled: true            # Enable early stopping
      patience: 10             # Early stopping patience
      min_delta: 0.001         # Minimum improvement threshold

# Training Configuration
training:
  mode: 'standard'             # Training mode: 'standard' | 'temporal'
  batch_size: 2                # CPU-friendly batch size
  accumulate_steps: 2          # Gradient accumulation for effective batch=4
  max_epochs: 20               # Maximum training epochs
  learning_rate: 1e-3          # Initial learning rate
  weight_decay: 1e-4           # L2 regularization
  direction_penalty_weight: 2.0 # λ_dir for directional loss
  
  # Progressive Training
  basic_epochs: 5              # Basic GNN training epochs
  risk_aware_epochs: 10        # Risk-aware training epochs
  basic_auc_threshold: 0.80    # Threshold to switch to risk-aware
  risk_recall_threshold: 0.75  # Risk recall threshold
  
  # Optimization
  enable_bf16: False            # Disable bfloat16 for CPU acceleration
  enable_gradient_checkpointing: True  # Memory-efficient training
  gradient_clip_norm: 1.0      # Gradient clipping
  
  # Scheduler
  scheduler_type: cosine       # Learning rate scheduler
  warmup_epochs: 2             # Warmup epochs
  eta_min_ratio: 0.01          # Minimum LR ratio

# Data Configuration  
data:
  graph_dir: "data/processed/graphs"        # Graph data directory
  cache_dir: "data/csr_cache"               # CSR cache directory
  metadata_dir: "data/processed/metadata"   # Metadata directory
  
  # Data Splits
  train_ratio: 0.8             # Training set ratio
  val_ratio: 0.1               # Validation set ratio
  test_ratio: 0.1              # Test set ratio
  
  # Data Loading
  num_workers: 4               # DataLoader workers
  pin_memory: true             # Pin memory for faster transfer
  prefetch_factor: 2           # Prefetch factor
  
  # Feature Processing
  feature_selection_method: "hybrid"  # Variance + correlation + domain
  variance_threshold: 0.01     # Variance threshold
  correlation_threshold: 0.9   # Correlation threshold
  
  # Risk Vectorization
  risk_norm_method: "zscore_sigmoid"  # Risk normalization method
  adaptive_binning: false      # Use fixed binning
  
  # Temporal Encoding
  temporal_encoding:
    enable: true               # Enable temporal encoding
    method: "log_bin"          # Encoding method: "log_bin" or "random_fourier"
    log_bins: 16               # Number of log bins for log_bin method
    fourier_dim: 32            # Feature dimension for random_fourier method
    fourier_sigma: 1.0         # Sigma parameter for random fourier features
    time_features: ["StartTime", "LastTime", "Dur"]  # Time columns to encode
    min_delta: 0.001           # Minimum time delta (seconds)
    max_delta: 3600.0          # Maximum time delta (seconds)

# Evaluation Configuration
evaluation:
  metrics:
    - "auc"                    # Area Under ROC Curve
    - "aupr"                   # Area Under Precision-Recall Curve
    - "directional_hit_100"    # Directional Hit@100
    - "mttd_30s"               # Mean Time To Detection (30s)
    - "risk_weighted_precision" # Risk-weighted Precision
    - "risk_weighted_recall"   # Risk-weighted Recall
  save_predictions: true       # Save prediction results
  save_attention_weights: true # Save attention weights for analysis
  visualization: true          # Generate visualizations
  confidence_interval: true    # Calculate confidence intervals
  statistical_test: "bootstrap" # Statistical significance test
  n_bootstrap: 1000            # Bootstrap samples

# Logging and Monitoring
logging:
  log_level: "INFO"            # Logging level
  log_dir: "logs"              # Log directory
  
  # Experiment Tracking
  enable_wandb: false          # Disable Weights & Biases
  enable_tensorboard: false    # Disable TensorBoard
  wandb_project: "riskniclp-5g" # WandB project name
  wandb_entity: null           # WandB entity (optional)
  
  # Monitoring
  log_system_metrics: true     # Log system performance
  system_metrics_interval: 100 # Log interval (steps)
  save_checkpoints: true       # Save model checkpoints
  checkpoint_interval: 500     # Checkpoint interval (steps)

# Security and Privacy
security:
  enable_data_anonymization: true    # Anonymize sensitive data
  hash_sensitive_fields: true        # Hash IP addresses etc.
  log_data_access: true              # Log data access
  max_log_retention_days: 30         # Log retention period

# Runtime Configuration
seed: 42                       # Random seed
device: "cpu"                  # Training device
num_threads: 8                 # CPU threads for PyTorch

# Experiment Metadata
experiment_name: null          # Experiment name (auto-generated if null)
experiment_tags: []            # Experiment tags
notes: "Baseline RiskNICLP-5G implementation with CPU optimization and heterogeneous node feature support" 